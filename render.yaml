services:
  - type: web
    name: leaflock-fm
    runtime: node
    # Paid Starter — always-on (no free-tier cold starts)
    plan: starter
    # Live radio uses ytdl-core URL resolve + 302 redirect (no stream proxy = no mid-track timeout).
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    domains:
      - fm.leaflock.com.au
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      # Only set these when a Render disk is mounted at /var/data.
      # Forcing /var/data without a disk causes: EACCES mkdir '/var/data'
      # and kills the instrumentation hook on boot.
      # - key: DATABASE_DIR
      #   value: /var/data/leaflock
      # - key: STATION_DATA_DIR
      #   value: /var/data/leaflock
      - key: DATABASE_URL
        value: postgresql://build:build@localhost:5432/build
      - key: APP_URL
        value: https://fm.leaflock.com.au
      - key: NEXT_PUBLIC_APP_URL
        value: https://fm.leaflock.com.au
      - key: FM_PLAYLIST_ID
        value: PLJFdPoHnfyMNIbriwNRh06u2z1Z5vZ7va
      - key: NEXT_PUBLIC_YOUTUBE_PLAYLIST_ID
        value: PLJFdPoHnfyMNIbriwNRh06u2z1Z5vZ7va
      # Do not proxy multi-MB audio through Render (that is what made live.mp3 stop).
      - key: DJ420_FORCE_PROXY
        value: "0"
      - key: DJ420_DISABLE_TRACK_AUDIO
        value: "0"
      # Optional: real Icecast/Liquidsoap URL (best continuous radio)
      # DJ420_UPSTREAM_URL: https://your-icecast:8000/live.mp3
      - key: NEXT_PUBLIC_STREAM_URL
        value: https://fm.leaflock.com.au/live.mp3
      - key: YOUTUBE_API_KEY
        value: AIzaSyD4f1Oc6R9xC58TSiS99BvayekV29rZO2A
      - key: FM_ADMIN_SECRET
        value: leaflock-fm-desk-2026
      - key: FM_OWNER_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FM_EMAIL_ON_LIKE
        value: "true"
      - key: WEBSITE_URL
        value: https://www.leaflock.com.au
      - key: MOBILE_GAME_URL
        value: https://wegrow.leaflock.com.au

  - type: cron
    name: dj420-warmup
    schedule: "*/5 * * * *"
    runtime: node
    buildCommand: "true"
    startCommand: curl -fsS "https://fm.leaflock.com.au/api/fm/warmup" || exit 1