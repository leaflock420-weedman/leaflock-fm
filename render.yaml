services:
  # Website (Next.js) — does NOT encode radio audio
  - type: web
    name: leaflock-fm
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    numInstances: 1
    domains:
      - fm.leaflock.com.au
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATABASE_URL
        value: postgresql://build:build@localhost:5432/build
      - key: APP_URL
        value: https://fm.leaflock.com.au
      - key: NEXT_PUBLIC_APP_URL
        value: https://fm.leaflock.com.au
      - key: FM_PLAYLIST_ID
        value: PLJFdPoHnfyMNIbriwNRh06u2z1Z5vZ7va
      - key: NEXT_PUBLIC_YOUTUBE_PLAYLIST_ID
        value: PLJFdPoHnfyMNIbriwNRh06u2z1Z5vZ7va
      # Permanent native <audio> points at the SEPARATE continuous encoder service
      - key: NEXT_PUBLIC_STREAM_URL
        value: https://leaflock-stream.onrender.com/live.mp3
      # Optional: proxy /live.mp3 on the main site to the stream service
      - key: DJ420_UPSTREAM_URL
        value: https://leaflock-stream.onrender.com/live.mp3
      - key: PRIMARY_STREAM_URL
        value: https://leaflock-stream.onrender.com/live.mp3
      - key: YOUTUBE_API_KEY
        value: AIzaSyD4f1Oc6R9xC58TSiS99BvayekV29rZO2A
      - key: FM_ADMIN_SECRET
        value: leaflock-fm-desk-2026
      - key: FM_OWNER_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FM_EMAIL_ON_LIKE
        value: "true"
      - key: WEBSITE_URL
        value: https://www.leaflock.com.au
      - key: MOBILE_GAME_URL
        value: https://wegrow.leaflock.com.au

  # Continuous radio encoder — separate from Next.js (Xiaohongshu model)
  - type: web
    name: leaflock-stream
    runtime: docker
    plan: starter
    dockerfilePath: ./stream-server/Dockerfile
    dockerContext: ./stream-server
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: FM_API_BASE
        value: https://fm.leaflock.com.au
      - key: DJ_CROSSFADE_SEC
        value: "5"
      - key: MP3_BITRATE
        value: 128k
      - key: PORT
        value: "8000"
      - key: FM_ADMIN_SECRET
        value: leaflock-fm-desk-2026

  - type: cron
    name: dj420-warmup
    schedule: "*/5 * * * *"
    runtime: node
    buildCommand: "true"
    startCommand: curl -fsS "https://fm.leaflock.com.au/api/fm/warmup" || exit 1
