services:
  - type: web
    name: leaflock-fm
    runtime: node
    # Paid Starter — always-on (no free-tier cold starts)
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /fm
    numInstances: 1
    domains:
      - fm.leaflock.com.au
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATABASE_URL
        value: postgresql://build:build@localhost:5432/build
      - key: APP_URL
        value: https://fm.leaflock.com.au
      - key: NEXT_PUBLIC_APP_URL
        value: https://fm.leaflock.com.au
      - key: FM_PLAYLIST_ID
        value: PLJFdPoHnfyMNIbriwNRh06u2z1Z5vZ7va
      - key: NEXT_PUBLIC_YOUTUBE_PLAYLIST_ID
        value: PLJFdPoHnfyMNIbriwNRh06u2z1Z5vZ7va
      - key: YOUTUBE_API_KEY
        value: AIzaSyD4f1Oc6R9xC58TSiS99BvayekV29rZO2A
      - key: FM_ADMIN_SECRET
        value: leaflock-fm-desk-2026
      - key: FM_OWNER_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FM_EMAIL_ON_LIKE
        value: "true"
      - key: WEBSITE_URL
        value: https://www.leaflock.com.au
      - key: MOBILE_GAME_URL
        value: https://wegrow.leaflock.com.au